# STATUS: DRAFT — drafted by Claude, awaiting human review
# Deterministic red-flag rules checked on every parent message, answer batch and document, before anything else.
# An LLM can only ADD a flag, never remove one. Matching runs over each sentence and each pair of neighbouring sentences: a rule fires when one `patterns`
# regex matches and no `negations` regex overlaps that match (see backend/app/safety/rules.py).
# Optional `min_age_months` / `max_age_months` gate a rule when the child's age is known (unknown age = rule active).
#
# Levels: EMERGENCY -> urgent screen, journey stops. URGENT_SOON -> banner + "see a doctor in the next day or two".
#
# FOR THE HUMAN REVIEWER — things Claude could not fully verify:
#   * crisis_lines.IN (Tele-MANAS 14416): read from the official site's JavaScript bundle (telemanas.mohfw.gov.in);
#     the page itself renders it dynamically. Please glance at the live site once before marking REVIEWED.
#   * max_age_months is inclusive: "under 3 months" is stored as max_age_months: 3 because age is whole months
#     (a 3-month-old is flagged too; deliberate over-flagging).
#   * teen_self_harm has no age gate: a parent of a younger child who says they want to die must still see the crisis help.
#   * Negations are deliberately narrow (no unbounded wildcards): they only cancel the words they sit on.
#   * Sources: each URL was fetched on 2026-10-15 and the cited guidance read. NHS pages are used as public, plain-language
#     guidance; unexplained_bruising_bleeding cites the NHS haemophilia symptoms page (closest reachable NHS page; a
#     paediatric haematology source would be better); morning_vomiting_headache cites the HeadSmart/"Better Safe Than
#     Tumour" site, which asks people to speak to a doctor when two or more symptoms appear.
#   * Patterns are English and deliberately broad; false alarms are cheaper than misses. Tune only via the corpus below.

version: 1
required_ids:
  EMERGENCY: [seizure_long_or_repeated, breathing_difficulty, unresponsive, poisoning, severe_head_injury, nonblanching_rash_fever, fever_under_3_months, severe_dehydration_infant, teen_self_harm]
  URGENT_SOON: [skill_regression, new_weakness_or_unsteadiness, rapid_head_growth, morning_vomiting_headache, unexplained_bruising_bleeding]
crisis_lines: {IN: 'Tele-MANAS 14416 (free, 24 hours)', US: '988 (call or text, 24 hours)', GB: Samaritans 116 123; Childline (under 19s) 0800 1111}
emergency_numbers: {IN: '112', EU: '112', US: '911'}
rules:
- id: seizure_long_or_repeated
  level: EMERGENCY
  patterns: ['\b(seizures?|seizing|fits?|fitting|convuls\w*)\b.{0,60}?\b([5-9]|[1-9]\d+|five|ten|fifteen|twenty|half an hour)\s*(min|mins|minutes)\b', '\b([5-9]|[1-9]\d+|five|ten|fifteen|twenty)\s*(min|mins|minutes)\b.{0,60}?\b(seizures?|seizing|fits?|fitting|convuls\w*)\b', '\b(seizures?|seizing|fits?|fitting|convuls\w*)\b.{0,40}?\b(won''?t|will not|did not|didn''?t|not|would not|wouldn''?t)\s+(stop|stopping)\b', '\b(another|second|third|again|repeated|several|back to back|one after another)\b.{0,40}?\b(seizures?|seizing|fits?|fitting|convuls\w*)\b', '\b(seizures?|seizing|fits?|fitting|convuls\w*)\b.{0,40}?\b(again|another one|twice|three times|more than once)\b', '\b(shaking|jerking|twitching|stiff)\b.{0,60}?\b(not responding|unresponsive|won''?t wake|cannot wake|can''?t wake|eyes rolled)\b', \b(first|1st)\s+(seizure|fit|convulsion)\b]
  negations: ['\b(no|never|without any|hasn''?t had any|has not had any|not had any)\s+(a\s+|any\s+)?(seizures?|seizing|fits?|fitting|convuls\w*)\b', \bfit and (well|healthy)\b, '\bkeeps? fit\b', \bfit for (school|sport|sports|work|games|pe|nursery)\b, '\b(don''?t|doesn''?t|do not|does not|won''?t|didn''?t) fit\b']
  plain: This sounds like a seizure that may be long or may be happening again. Please call your local emergency number now. While you wait, lay your child on their side on a soft surface, do not put anything in their mouth, and stay with them.
  source: https://www.nhs.uk/conditions/febrile-seizures/
- id: breathing_difficulty
  level: EMERGENCY
  patterns: ['\b(struggling|difficulty|trouble|hard|working hard)\b.{0,80}?\bbreath(e|ing)\b', '\bcan''?t breathe\b', \bcannot breathe\b, \bgasping\b, '\bgrunting\b.{0,80}?\b(breath|breathing|every breath)\b', '\b(blue|bluish|grey|gray)\b.{0,80}?\b(lips|tongue|face|skin)\b', '\b(lips|tongue)\b.{0,80}?\b(blue|bluish)\b', '\b(tummy|belly|chest|ribs)\b.{0,80}?\b(sucking in|sucks in|pulling in|sinking in|sucking under)\b', '\b(stops|stopped|pauses|pausing|paused)\b.{0,80}?\bbreathing\b', '\bbreathing\b.{0,80}?\b(stops|stopped|pauses|pausing)\b', '\bbreathing (very )?(fast|fast and shallow)\b.{0,80}?\b(can''?t|cannot|struggl)', '\b(face|lips|skin|tongue)\b.{0,25}?\b(went|turned|turning|gone|going|looks?|looked|is|are)\b.{0,10}?\b(blue|bluish|grey|gray)\b']
  negations: ['\bno (trouble|difficulty|problems?) (with )?breath(e|ing)\b', '\bbreathing (is |was )?(fine|normal|ok|okay)\b', \bnot (struggling|having trouble|blue)\b, '\bbreath(e|ing) (is |was )?easy\b']
  plain: Trouble breathing needs help right away. Please call your local emergency number now. Keep your child upright and calm, and stay with them.
  source: https://www.nhs.uk/conditions/bronchiolitis/
- id: unresponsive
  level: EMERGENCY
  patterns: [\b(unresponsive|unconscious|passed out|collapsed|limp and)\b, '\b(won''?t|will not|can''?t|cannot|couldn''?t)\s+(wake|be woken|be roused)\b', \bhard to (wake|rouse)\b, \bnot (responding|waking)\b, '\b(floppy|limp)\b.{0,80}?\b(not responding|won''?t wake|unresponsive)\b', \bblacked out\b, '\bfainted\b.{0,80}?\b(not|hasn''?t|won''?t)\b.{0,80}?\b(come|wake|respond)']
  negations: [\bno (collapse|collapsing|fainting)\b, \bnever (passed out|collapsed|fainted)\b, '\bwakes? (up )?(easily|fine|normally)\b', \bcollapsed (his|her|their) (sandcastle|tower|block)]
  plain: A child who cannot be woken or is not responding needs help right away. Please call your local emergency number now. If they are breathing, lay them on their side and stay with them.
  source: https://www.nhs.uk/conditions/head-injury-and-concussion/
- id: poisoning
  level: EMERGENCY
  patterns: ['\b(swallowed|swallow|ate|eaten|drank|drunk|chewed|took|taken)\b.{0,60}?\b(tablets?|pills?|medicine|medication|bleach|detergent|cleaning|battery|batteries|button battery|poison|poisonous|paraffin|petrol|kerosene|pesticide|rat poison|liquid)\b', \b(overdose|overdosed|poisoned|poisoning)\b, '\bdrank (some )?(bleach|cleaner|cleaning|petrol|kerosene)\b', \bgot into the (medicine|medicines|tablets|pills)\b, \b(ate|eaten|chewed|swallowed)\b.*\b(wild|unknown|garden|poisonous|unfamiliar) (berries|mushrooms|plant|plants|leaves|seeds)\b]
  negations: ['\b(didn''?t|did not|never|hasn''?t|has not)\s+(swallow|eat|drink|take|ate|drank|took)\b', '\b(took|taken|take|takes|gave|given)\b[^.]{0,40}\b(as prescribed|as directed|correct dose|right dose|usual dose|as the doctor said)\b', '\b(ate|eaten|drank|drunk)\b[^.]{0,20}\b(liquid food|clear liquids?|plenty of liquids?|liquids)\b']
  plain: Swallowing something harmful needs help right away. Please call your local emergency number or poison helpline now. Keep the packaging, do not make your child sick, and stay with them.
  source: https://www.nhs.uk/conditions/poisoning/
- id: severe_head_injury
  level: EMERGENCY
  patterns: ['\b(hit|banged|bumped|knocked|smashed|fell on|fell and hit|struck)\b.{0,80}?\b(head)\b.{0,80}?\b(vomit|vomited|vomiting|sick|drowsy|sleepy|confused|knocked out|unconscious|blacked out|seizure|fit|bleeding|won''?t wake|clear fluid)\b', '\b(head injury|head trauma)\b.{0,80}?\b(vomit|vomited|vomiting|drowsy|sleepy|confused|knocked out|unconscious|seizure|fit|bleeding|fluid)\b', \bknocked out\b, '\bfell (from|off)\b.{0,80}?\b(roof|balcony|window|stairs|height|tree|wall)\b.{0,80}?\bhead\b', '\bclear fluid\b.{0,80}?\b(ear|ears|nose)\b', '\bhead\b.{0,80}?\b(road accident|car accident|crash|hit by a)\b']
  negations: [\bno (head injury|vomiting|drowsiness)\b, '\bwasn''?t knocked out\b', '\b(not|never) (been )?knocked out\b']
  plain: A knock to the head with these signs needs urgent checking. Please call your local emergency number or go to an emergency department now. Keep your child still and awake, and stay with them.
  source: https://www.nhs.uk/conditions/head-injury-and-concussion/
- id: nonblanching_rash_fever
  level: EMERGENCY
  patterns: ['\b(rash|spots|marks|bruise like|purple|purplish|blotches|blotchy)\b.{0,80}?\b(doesn''?t|does not|won''?t|will not|not)\s+(fade|go away|blanch|disappear)\b', '\b(glass test|tumbler test|glass)\b.{0,80}?\b(doesn''?t|does not|didn''?t|did not|still|not)\b.{0,80}?\b(fade|visible|there|see)\b', '\bnon[- ]?blanching\b', '\b(fever|temperature|hot)\b.{0,80}?\b(rash|purple spots|red spots|pin ?prick spots)\b.{0,80}?\b(doesn''?t|does not|won''?t|not)\b.{0,80}?\b(fade|disappear|go)', '\bpurple (rash|spots|marks)\b.{0,80}?\b(fever|temperature|unwell|ill)\b', '\b(fever|temperature)\b.{0,80}?\bpurple (rash|spots|marks|blotches)\b']
  negations: ['\b(rash|spots|marks|it|they) (does |did |will |would )?fades? (when|if|under)\b', \bno rash\b]
  plain: 'A rash that does not fade when pressed, with fever or a child who seems unwell, needs urgent help. Please call your local emergency number now. Press a clear glass on the rash: if you can still see it through the glass, tell the emergency team.'
  source: https://www.nhs.uk/conditions/meningitis/symptoms/
- id: fever_under_3_months
  level: EMERGENCY
  max_age_months: 3
  patterns: [\b(fever|temperature|feverish|febrile|burning up|hot to touch)\b, '\b(38|39|40)(\.\d)?\s*(c|°|degrees)\b', '\b(100\.4|101|102|103)(\.\d)?\s*(f|°)\b']
  negations: [\bno (fever|temperature)\b, \bnormal temperature\b, \bnot (feverish|hot|had a fever)\b, \btemperature (is|was) (normal|fine)\b, '\bwithout (a )?fever\b']
  plain: A fever in a baby under 3 months needs a doctor right away. Please call your local emergency number or go to an emergency department now, even if your baby looks well.
  source: https://www.nhs.uk/conditions/fever-in-children/
- id: severe_dehydration_infant
  level: EMERGENCY
  max_age_months: 24
  patterns: [\b(no|not any|hardly any|barely any|few)\s+(wet nappies|wet nappy|wet diapers|wet diaper|pee|wee|urine|tears)\b, '\bsunken\b.{0,80}?\b(soft spot|fontanelle|fontanel|eyes)\b', '\b(soft spot|fontanelle|fontanel)\b.{0,80}?\b(sunken|sinking|dipped|sunk)\b', '\bnot (had|passed)\b.{0,80}?\b(wet nappy|wet diaper|pee|wee|urine)\b.{0,80}?\b(hours|since|all day|today|12|8)\b', '\b(vomiting|vomit|diarrh(o)?ea|throwing up)\b.{0,80}?\b(can''?t keep|won''?t keep|cannot keep|not keeping)\b.{0,80}?\b(anything|fluids|milk|water|feed)\b', '\b(dry|very dry)\b.{0,80}?\b(mouth|lips)\b.{0,80}?\b(drowsy|floppy|sleepy|no tears)\b', '\b(loose motions?|watery (stool|stools|poo)|diarrh(o)?ea|vomiting)\b.{0,80}?\b(no|not|hardly any|barely any)\b.{0,30}?\b(pee|wee|urine|urinat\w*|passed urine|wet nappies|tears)\b', '\bnot (passed|had)\b.{0,20}?\b(urine|pee|wee)\b.{0,30}?\b(all day|today|since|hours)\b']
  negations: [\bnormal (wet nappies|nappies|pee|wee)\b, \b(lots of|plenty of|many) wet (nappies|nappy|diapers)\b, \b(is|was|are|were) keeping (fluids|milk|feeds) down\b]
  plain: Signs like very few wet nappies, no tears or a sunken soft spot can mean your baby is badly short of fluid. Please call your local emergency number or go to an emergency department now. Offer small sips or a feed on the way if your baby will take it.
  source: https://www.nhs.uk/conditions/dehydration/
- id: teen_self_harm
  level: EMERGENCY
  patterns: ['\b(wants?|wanted|want|talks? about|talking about|talked about|thinks? about|thinking about|thought about|says (he|she|they)|saying|said)\b.{0,80}?\b(to die|kill (him|her|them)self|killing (him|her|them)self|end (his|her|their) life|ending (his|her|their) life|suicide|suicidal|better off dead|not be here|not want to be here|no reason to live)\b', '\b(self[- ]?harm|self[- ]?harming|cutting (him|her|them)self|cuts? (his|her|their) (arms?|wrists?|legs?)|hurting (him|her|them)self|hurt (him|her|them)self)\b', '\b(tried|attempted|attempt)\b.{0,80}?\b(to (kill|end|hurt)|suicide|overdose|take (his|her|their) own life)\b', '\b(took|taken) (an |a lot of )?(overdose|too many (tablets|pills))\b', \bsuicide (note|plan|attempt)\b, '\b(wants?|wanted) to (hurt|harm) (him|her|them)self\b']
  negations: ['\b(no|never|not|without)\s+(any\s+)?(signs? of\s+)?(self[- ]?harm|suicid\w*|thoughts of (dying|suicide))\b', '\bdoesn''?t want to die\b', \bnot suicidal\b, \bsuicide squad\b]
  plain: Thank you for telling us. Your child's safety comes first. If they may be in danger right now, call your local emergency number. You can also talk to a crisis line at any time, and stay with your child until you have help.
  source: https://www.nhs.uk/nhs-services/mental-health-services/where-to-get-urgent-help-for-mental-health/
- id: skill_regression
  level: URGENT_SOON
  patterns: ['\b(lost|losing|loses|forgotten|forgot|stopped|stopping|no longer|can''?t any more|cannot any more|doesn''?t any more|not able to any more|gone backwards|going backwards|regressed|regressing|regression|backslid|slipping back)\b.{0,80}?\b(skills?|words?|talking|speaking|speech|walking|crawling|sitting|clapping|waving|eye contact|smiling|toilet|potty|trained|feeding|using (his|her|their) hands|abilities)\b', '\b(skills?|words?|speech|walking|talking)\b.{0,80}?\b(lost|disappeared|gone|regressed|going backwards|got worse and worse|slipping)\b', '\bused to (say|talk|walk|crawl|sit|clap|wave|smile|use)\b.{0,80}?\b(but|and)\b.{0,80}?\b(now|no longer|stopped|can''?t|doesn''?t)\b', '\b(can''?t|cannot|doesn''?t|does not|won''?t)\b.{0,80}?\b(do|say|walk|talk)\b.{0,80}?\b(what|things) (he|she|they) (could|used to)\b']
  negations: [\bno (loss of|regression)\b, '\bhasn''?t lost\b', '\bnot lost (any )?(skills|words)\b', \bnever (lost|regressed)\b, '\bno longer (needs|wears) (a )?(nappy|diaper)\b', '\bstopped (using|needing) (a )?(dummy|pacifier|bottle|nappies)\b']
  plain: Losing skills your child once had is something a doctor should look at soon. Please book an appointment in the next day or two and tell them exactly what has changed and when.
  source: https://www.cdc.gov/act-early/milestones/index.html
- id: new_weakness_or_unsteadiness
  level: URGENT_SOON
  patterns: ['\b(new|sudden|suddenly|recent|getting worse|worse every day|over (the )?(last|past) (few )?(days|weeks))\b.{0,80}?\b(weak|weakness|weaker|floppy|clumsy|unsteady|wobbly|stumbling|falling over|dragging (a|his|her|their) (leg|foot)|limp|limping|can''?t (walk|stand|lift|climb)|trouble (walking|standing|climbing|lifting)|legs? (give|gave) way|drooping|droop|droops|slurred|slurring)\b', '\b(weak|weakness|wobbly|unsteady|floppy|clumsy|stumbling|falling over)\b.{0,80}?\b(new|sudden|suddenly|since (last|this)|getting worse|worse every day|over (the )?(last|past) (few )?(days|weeks))\b', '\b(legs?|arms?|hands?|face)\b.{0,80}?\b(feel|feels|felt|are|is)\b.{0,80}?\b(weak|heavy|numb|wobbly)\b.{0,80}?\b(suddenly|new|now|getting worse|this week|since)\b', '\b(can''?t|cannot|unable to) (stand|walk|climb stairs|get up|lift (his|her|their) (arm|arms|leg|legs))\b.{0,80}?\b(since|suddenly|now|this week|yesterday|today)\b']
  negations: [\bno (weakness|unsteadiness)\b, '\b(not|isn''?t) (weak|unsteady|wobbly)\b', \bhas always been (clumsy|wobbly|unsteady)\b, '\balways (been )?(clumsy|wobbly)\b', \bnot new\b]
  plain: New weakness, floppiness or unsteadiness is something a doctor should check soon. Please book an appointment in the next day or two, and go to an emergency department if it is getting worse quickly.
  source: https://www.nhs.uk/conditions/guillain-barre-syndrome/
- id: rapid_head_growth
  level: URGENT_SOON
  max_age_months: 36
  patterns: ['\bhead\b.{0,80}?\b(growing|grown|grew|getting)\b.{0,80}?\b(fast|quickly|rapidly|too fast|too big|bigger|larger|so much)\b', '\b(big|bigger|large|larger|enlarged|swollen|huge)\b.{0,80}?\bhead\b.{0,80}?\b(suddenly|quickly|fast|rapidly|lately|recently|new|crossed|percentile|centile|bulging)\b', '\bbulging\b.{0,80}?\b(soft spot|fontanelle|fontanel)\b', '\b(soft spot|fontanelle|fontanel)\b.{0,80}?\b(bulging|bulges|tense|swollen|raised|sticking out)\b', '\bhead (circumference|size)\b.{0,80}?\b(jumped|crossed|increased|growing too|above|rapid)\b', '\bhead\b.{0,80}?\bmeasure\w*\b.{0,80}?\b(bigger|larger|jumped|crossed)\b']
  negations: [\bno (bulging|rapid)\b, \bhead (size|growth) (is|was) (normal|fine)\b, '\bsoft spot (is |looks |feels )?(flat|normal|fine)\b', \bnormal head\b]
  plain: A head that is growing very fast, or a soft spot that looks tense or bulging, should be checked by a doctor soon. Please book an appointment in the next day or two. Go to an emergency department if your baby is also very sleepy or being sick.
  source: https://www.nhs.uk/conditions/hydrocephalus/symptoms/
- id: morning_vomiting_headache
  level: URGENT_SOON
  patterns: ['^(?=.*\b(morning|mornings|waking|wakes up|woke up|on waking|first thing)\b)(?=.*\b(headache|headaches|head hurts|head ache)\b)(?=.*\b(vomit|vomiting|vomited|sick|being sick|throws? up|throwing up)\b)', '\b(headache|headaches)\b.*\bwake[sn]? (him|her|them) (up )?(at night|in the night)\b.*\b(vomit|vomiting|sick|being sick)\b']
  negations: [\bno (headache|headaches|vomiting)\b, \b(stomach|tummy) bug\b, \b(food poisoning|gastro|norovirus|stomach flu)\b, '\bnot (been )?(sick|vomiting)\b']
  plain: Headaches together with being sick, especially in the morning, are worth getting checked soon. Please book an appointment in the next day or two. Go to an emergency department if your child is very sleepy, confused or the headache is the worst they have had.
  source: https://bettersafethantumour.com/
- id: unexplained_bruising_bleeding
  level: URGENT_SOON
  patterns: ['\b(bruises?|bruising|bruised)\b.{0,80}?\b(no reason|for no reason|nowhere|out of nowhere|unexplained|don''?t know (how|why)|can''?t explain|everywhere|all over|easily|so easily|a lot|lots|keep appearing|keeps appearing|appear)\b', '\b(unexplained|unusual|lots of|many|so many|easy|easily)\b.{0,80}?\b(bruises?|bruising|bleeding|nosebleeds?)\b', '\b(nosebleeds?|nose bleeds?|gums? bleed|bleeding gums|bleeds? (a lot|for ages|a long time|for a long time))\b.{0,80}?\b(often|again and again|every day|frequent|frequently|won''?t stop|wouldn''?t stop|keeps|for ages|long time|a lot)\b', '\b(tiny|small|red|purple|pin ?prick)\b.{0,80}?\b(spots|dots)\b.{0,80}?\b(skin|legs|body|arms)\b.{0,80}?\b(no reason|appeared|appear|unexplained|everywhere)\b', \bblood in (his|her|their) (poo|stool|wee|pee|urine)\b]
  negations: [\bno (bruising|bruises|bleeding)\b, '\b(one|a) (small )?bruise (from|after)\b', '\bbruise(d)? (from|after) (a )?(fall|football|football|playing|bumping|bumped|sport|knee)\b', \bnormal (bruises|bruising)\b, '\bfrom (a )?(fall|football|bike)\b']
  plain: Bruises or bleeding that you cannot explain, or that happen very easily, should be checked by a doctor soon. Please book an appointment in the next day or two, and go to an emergency department if bleeding will not stop.
  source: https://www.nhs.uk/conditions/haemophilia/symptoms/
corpus:
  should_flag:
  - {text: She had a seizure for about 10 minutes and it did not stop, expect_id: seizure_long_or_repeated}
  - {text: 'He had another fit just now, the second one today', expect_id: seizure_long_or_repeated}
  - {text: His arms and legs were jerking and he was not responding to us, expect_id: seizure_long_or_repeated}
  - {text: It was her first seizure ever and she went stiff and blue, expect_id: seizure_long_or_repeated}
  - {text: He is struggling to breathe and his tummy is sucking in, expect_id: breathing_difficulty}
  - {text: Her lips look blue and she is gasping, expect_id: breathing_difficulty}
  - {text: He collapsed at school and is not responding, expect_id: unresponsive}
  - {text: 'She won''t wake up properly, she is very hard to wake', expect_id: unresponsive}
  - {text: I think he swallowed some of my tablets, expect_id: poisoning}
  - {text: She drank some bleach from the bottle under the sink, expect_id: poisoning}
  - {text: He swallowed a button battery this afternoon, expect_id: poisoning}
  - {text: 'She fell off the bed and hit her head, then vomited twice and is very drowsy', expect_id: severe_head_injury}
  - {text: He was knocked out for a minute after the fall, expect_id: severe_head_injury}
  - {text: High fever and a purple rash that doesn't fade when I press a glass on it, expect_id: nonblanching_rash_fever}
  - {text: He has a fever and red spots that won't fade, expect_id: nonblanching_rash_fever}
  - {text: My 6 week old has a temperature of 38.5, expect_id: fever_under_3_months, age_months: 1}
  - {text: The baby feels hot and feverish tonight, expect_id: fever_under_3_months, age_months: 2}
  - {text: He has had no wet nappies since this morning and the soft spot looks sunken, expect_id: severe_dehydration_infant, age_months: 7}
  - {text: 'She is vomiting and cannot keep any milk down, hardly any wet nappies today', expect_id: severe_dehydration_infant, age_months: 5}
  - {text: My 15 year old said she wants to die, expect_id: teen_self_harm, age_months: 180}
  - {text: 'I found cuts on his arms, I think he has been self-harming', expect_id: teen_self_harm, age_months: 168}
