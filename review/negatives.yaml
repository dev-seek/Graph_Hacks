# STATUS: REVIEWED by Manoj on 2026-10-15.
# 40 made-up "common explanation" children/teens: situations that should NOT lead to a rare-disease referral.
# They tune and test our false-alarm rate, so they exist before any tuning happens (needed at the start of P2).
# Review notes for the human: check ages and wording are realistic; `expected` is either
#   no_escalation  = nothing special needed, or
#   see_doctor_ok  = a routine doctor visit is reasonable, but a rare-disease referral would be a false alarm.
# Signs are in plain words; the build resolves them to HPO terms (data/derived/negatives.resolved.yaml) for you to glance at.
# `make review-check` also runs the safety rules over these: no_escalation cases must trigger no flag, others no EMERGENCY.

